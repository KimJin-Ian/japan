name: 후보 수집

# 하루 3회(한국 시간 07:00 · 15:00 · 23:00).
# PR TIMES 뉴스 사이트맵은 최근 약 16시간치만 담고 있어서(2026-11-14 실측), 하루 1회로는 8시간치가 빠진다.
# 이미 저장한 주소는 건너뛰므로 여러 번 돌려도 번역 비용은 새 글만큼만 든다.
on:
  schedule:
    - cron: "0 22,6,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 공개 피드·환율 수집
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python collector/collect.py
      - name: PR TIMES 원문에서 본문·대표 이미지 채우기
        # 앞 단계가 일부 실패해도 이어서 돌린다
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python collector/enrich.py
      - name: Claude 번역·분류·게시
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 기본은 Haiku(하루 2,000건 이상을 번역하므로). 바꾸려면 저장소 Variables 에 ANALYZE_MODEL 을 넣는다 (예: claude-opus-5-5)
          ANALYZE_MODEL: ${{ vars.ANALYZE_MODEL || 'claude-haiku-5-5' }}
          ANALYZE_LIMIT: "4000"
        run: |
          pip install -q anthropic pydantic
          python collector/analyze.py
