name: 후보 수집

# 하루 1회(한국 시간 07:00). PR TIMES 는 뉴스 사이트맵으로 하루치 전량을 받는다.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 공개 피드·환율 수집
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python collector/collect.py
      - name: PR TIMES 원문에서 본문·대표 이미지 채우기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python collector/enrich.py
      - name: Claude 번역·분류·게시
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 모델을 바꾸려면 저장소 Variables 에 ANALYZE_MODEL 을 넣는다 (예: claude-haiku-5-5)
          ANALYZE_MODEL: ${{ vars.ANALYZE_MODEL || 'claude-opus-5-5' }}
          ANALYZE_LIMIT: "4000"
        run: |
          pip install -q anthropic pydantic
          python collector/analyze.py
